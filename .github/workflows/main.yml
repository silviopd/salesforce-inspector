name: Build Salesforce Inspector

on:
  release:
    types: [published]   # 🔹 corre release cuando publicas una release desde la UI
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            os: macOS
          - platform: ubuntu-22.04
            os: Linux
          - platform: windows-latest
            os: Windows

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Node.js dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build

      # ----------------------------
      # Crear ZIP portable en Windows
      # ----------------------------
      - name: Crear ZIP portable (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          cd src-tauri/target/release
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item .\salesforce-inspector-app.exe .\portable\salesforce-inspector-app.exe
          Compress-Archive -Path .\portable\* -DestinationPath .\salesforce-inspector-portable.zip -Force

      # ----------------------------
      # Upload artifacts por OS
      # ----------------------------

      - name: Upload macOS artifacts
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: salesforce-inspector-macos
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/salesforce-inspector-app
          if-no-files-found: error

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: salesforce-inspector-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/salesforce-inspector-app.exe
            src-tauri/target/release/salesforce-inspector-portable.zip
          if-no-files-found: error

      - name: Upload Linux artifacts
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: salesforce-inspector-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/salesforce-inspector-app
          if-no-files-found: error

  # ----------------------------
  # RELEASE JOB SOLO PARA RELEASE PUBLICADA
  # ----------------------------
  release:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ----------------------------
      # Descargar artifacts separados
      # ----------------------------

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: salesforce-inspector-macos
          path: artifacts/macos

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: salesforce-inspector-windows
          path: artifacts/windows

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: salesforce-inspector-linux
          path: artifacts/linux

      - name: Display structure
        run: ls -R artifacts/

      # ----------------------------
      # Crear o actualizar Release
      # ----------------------------

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          name: ${{ github.event.release.name }}
          files: |
            artifacts/macos/**/*.dmg
            artifacts/windows/**/*.msi
            artifacts/windows/**/*.exe
            artifacts/windows/**/*portable*.zip
            artifacts/linux/**/*.deb
            artifacts/linux/**/*.AppImage
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
